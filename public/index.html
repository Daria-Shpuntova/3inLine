<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Три в ряд с бонусами</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="game-container">
  <!-- Шапка игры -->
  <div class="game-header">
    <div class="player-info">
      <div class="player-name" id="playerName">Игрок</div>
      <div class="coins" id="coins">💰 100</div>
    </div>
    <div class="lives-container" id="livesContainer">
      ❤️ <span id="lives">5</span>/5
      <div id="lifeRestoreTimer" style="display: block; font-size: 12px; color: #666; margin-top: 5px;"></div>
    </div>
  </div>
  <div style="text-align: center; margin: 10px 0;">
    <button onclick="function giveTestBonuses() {
      if (window.game) {
        window.game.inventory = {
            lightning: 5,
            cross: 5,
            bomb: 5,
            rainbow: 5
        };
        window.game.updateUI();
        window.game.showMessage('Тестовые бонусы добавлены!', 'success');
    }
    }
    giveTestBonuses()" style="padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer;">
      🎁 Дать тестовые бонусы
    </button>

    <button onclick="if(window.game){ window.game.coins = 10000; window.game.inventory = { lightning: 5, cross: 5, bomb: 5, rainbow: 5 }; window.game.updateUI(); window.game.showMessage('Бонусы и монеты добавлены!', 'success'); }"
            style="padding: 8px 16px; background: #4CAF50; color: white; border: none; border-radius: 8px; cursor: pointer;">
      🎁 Дать тестовые бонусы и монеты
    </button>
  </div>

  <div class="theme-selector">
    <button class="theme-btn" data-theme="forest">🌲 Лес</button>
    <button class="theme-btn" data-theme="space">🚀 Космос</button>
    <button class="theme-btn" data-theme="magic">✨ Магия</button>
  </div>


  <!-- Выбор размера поля -->
  <div class="board-size-selector">
    <button class="size-btn" data-size="6">6x6</button>
    <button class="size-btn active" data-size="8">8x8</button>
    <button class="size-btn" data-size="10">10x10</button>
  </div>

  <!-- Игровое поле -->
  <div class="game-board" id="gameBoard"></div>

  <!-- Статистика игры -->
  <div class="game-stats">
    <div class="stat">
      <span class="stat-label">Счет:</span>
      <span class="stat-value" id="score">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Цель:</span>
      <span class="stat-value" id="goal">500</span>
    </div>
    <div class="stat">
      <span class="stat-label">Ходы:</span>
      <span class="stat-value" id="moves">20</span>
    </div>
  </div>

  <!-- Бонусы -->
  <!-- Бонусы -->
  <div class="bonuses">
    <div class="bonus-card" data-bonus="lightning">
      <div class="bonus-icon">⚡</div>
      <div class="bonus-name">Молния</div>
      <div class="bonus-count" id="lightningCount">0</div>
      <div class="bonus-price">150 🪙</div>
      <div class="bonus-description">Уничтожает ряд</div>
      <button class="bonus-buy-btn" data-bonus="lightning" title="Купить молнию">
        <span class="buy-icon">🛒</span> Купить
      </button>
    </div>
    <div class="bonus-card" data-bonus="cross">
      <div class="bonus-icon">✚</div>
      <div class="bonus-name">Крест</div>
      <div class="bonus-count" id="crossCount">0</div>
      <div class="bonus-price">250 🪙</div>
      <div class="bonus-description">Ряд и колонка</div>
      <button class="bonus-buy-btn" data-bonus="cross" title="Купить крест">
        <span class="buy-icon">🛒</span> Купить
      </button>
    </div>
    <div class="bonus-card" data-bonus="bomb">
      <div class="bonus-icon">💣</div>
      <div class="bonus-name">Бомба</div>
      <div class="bonus-count" id="bombCount">0</div>
      <div class="bonus-price">100 🪙</div>
      <div class="bonus-description">Область 3x3</div>
      <button class="bonus-buy-btn" data-bonus="bomb" title="Купить бомбу">
        <span class="buy-icon">🛒</span> Купить
      </button>
    </div>
    <div class="bonus-card" data-bonus="rainbow">
      <div class="bonus-icon">🌈</div>
      <div class="bonus-name">Радуга</div>
      <div class="bonus-count" id="rainbowCount">0</div>
      <div class="bonus-price">200 🪙</div>
      <div class="bonus-description">Все одного цвета</div>
      <button class="bonus-buy-btn" data-bonus="rainbow" title="Купить радугу">
        <span class="buy-icon">🛒</span> Купить
      </button>
    </div>
  </div>


  <!-- Кнопки действий -->
  <div class="game-actions">
    <button class="btn btn-primary" id="newGameBtn">Новая игра</button>
    <button class="btn btn-secondary" id="buyMovesBtn">+5 ходов (реклама)</button>
  </div>

  <!-- Сообщения -->
  <div class="game-message" id="gameMessage"></div>
</div>

<!-- Подключение скриптов -->
<script src="api.js"></script>
<script src="themes.js"></script>
<script src="board.js"></script>
<script src="game.js"></script>
<script src="bonuses.js"></script>

<script src="animations.js"></script>
<script src="DragDropManager.js"></script>

</body>
</html>
